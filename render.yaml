services:
  - type: web
    name: neurolearn-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: DB_PATH
        value: ./data/neurolearn_db.json
      - key: PYTHONUNBUFFERED
        value: "1"
